[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortsforge"
version = "0.1.0"
description = "One long clip in, one vertical short out: cut the dead air, reframe to 9:16, burn AI captions, draft a cover and hashtags."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "shortsforge contributors" }]
keywords = ["video", "shorts", "vertical", "ffmpeg", "subtitles", "whisper", "reels", "tiktok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = ["imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "jieba>=0.42"]

[project.scripts]
shortsforge = "shortsforge.cli:main"

[project.urls]
Homepage = "https://github.com/lasy8888/shortsforge"
Source = "https://github.com/lasy8888/shortsforge"
Issues = "https://github.com/lasy8888/shortsforge/issues"

[tool.setuptools.packages.find]
include = ["shortsforge*"]

[tool.setuptools.package-data]
shortsforge = ["styles/*.json"]
